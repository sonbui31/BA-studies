<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tài liệu đặc tả yêu cầu phần mềm VClassio Check-in">
  <title>VClassio Check-in | SRS</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f4f6f5;
      --surface: #ffffff;
      --surface-muted: #f7f9f8;
      --text: #18201d;
      --text-muted: #5d6964;
      --border: #d8dfdc;
      --accent: #08775c;
      --accent-soft: #e8f5f0;
      --code: #16201c;
      --code-text: #e8f5f0;
      --sidebar-width: 304px;
      --header-height: 64px;
      --radius: 6px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: calc(var(--header-height) + 20px);
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, "Helvetica Neue", sans-serif;
      font-size: 15px;
      line-height: 1.65;
    }

    button,
    input {
      font: inherit;
    }

    .topbar {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 20;
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr) auto;
      align-items: center;
      min-height: var(--header-height);
      border-bottom: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.96);
      padding: 0 22px;
    }

    .brand {
      min-width: 0;
      color: var(--text);
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }

    .brand span {
      color: var(--accent);
    }

    .search {
      position: relative;
      width: min(440px, 100%);
      justify-self: center;
    }

    .search input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      background: var(--surface-muted);
      color: var(--text);
      padding: 0 42px 0 12px;
    }

    .search input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search kbd {
      position: absolute;
      top: 8px;
      right: 9px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--surface);
      color: var(--text-muted);
      padding: 1px 6px;
      font-size: 11px;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 18px;
    }

    .button {
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      padding: 7px 12px;
      font-weight: 600;
    }

    .button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .menu-button {
      display: none;
      width: 38px;
      padding: 0;
      font-size: 20px;
      line-height: 1;
    }

    .sidebar {
      position: fixed;
      top: var(--header-height);
      bottom: 0;
      left: 0;
      z-index: 15;
      width: var(--sidebar-width);
      overflow-y: auto;
      border-right: 1px solid var(--border);
      background: var(--surface);
      padding: 22px 14px 32px;
    }

    .toc-label {
      margin: 0 8px 12px;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    #toc {
      display: grid;
      gap: 2px;
    }

    #toc a {
      display: block;
      border-left: 2px solid transparent;
      color: var(--text-muted);
      padding: 6px 8px;
      text-decoration: none;
      line-height: 1.35;
    }

    #toc a:hover,
    #toc a.active {
      border-left-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent);
    }

    #toc a[data-level="3"] {
      padding-left: 20px;
      font-size: 13px;
    }

    #toc a[data-level="4"] {
      padding-left: 32px;
      font-size: 12px;
    }

    main {
      margin-left: var(--sidebar-width);
      padding: calc(var(--header-height) + 36px) 32px 72px;
    }

    .document {
      width: min(100%, 980px);
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 48px 56px 72px;
      box-shadow: 0 12px 36px rgba(24, 32, 29, 0.06);
    }

    .loading,
    .error {
      color: var(--text-muted);
      padding: 24px 0;
    }

    .error {
      color: #9b2c2c;
    }

    h1,
    h2,
    h3,
    h4 {
      color: var(--text);
      line-height: 1.3;
      letter-spacing: 0;
    }

    h1 {
      margin: 0 0 32px;
      padding-bottom: 20px;
      border-bottom: 3px solid var(--accent);
      font-size: 34px;
    }

    h2 {
      margin: 56px 0 18px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 25px;
    }

    h3 {
      margin: 36px 0 14px;
      font-size: 20px;
    }

    h4 {
      margin: 28px 0 12px;
      font-size: 16px;
    }

    p,
    ul,
    ol {
      max-width: 78ch;
    }

    a {
      color: var(--accent);
    }

    hr {
      margin: 44px 0;
      border: 0;
      border-top: 1px solid var(--border);
    }

    blockquote {
      margin: 20px 0;
      border-left: 4px solid var(--accent);
      background: var(--accent-soft);
      padding: 12px 18px;
    }

    blockquote > :first-child {
      margin-top: 0;
    }

    blockquote > :last-child {
      margin-bottom: 0;
    }

    .table-wrap {
      max-width: 100%;
      overflow-x: auto;
      margin: 18px 0 26px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      font-size: 14px;
    }

    th,
    td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }

    th:last-child,
    td:last-child {
      border-right: 0;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    th {
      background: var(--surface-muted);
      color: var(--text);
      font-weight: 700;
    }

    code {
      border-radius: 4px;
      background: #edf1ef;
      padding: 2px 5px;
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 0.9em;
    }

    pre {
      max-width: 100%;
      overflow-x: auto;
      border-radius: var(--radius);
      background: var(--code);
      color: var(--code-text);
      padding: 18px;
    }

    pre code {
      background: transparent;
      color: inherit;
      padding: 0;
    }

    .diagram {
      max-width: 100%;
      overflow-x: auto;
      margin: 18px 0 30px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #ffffff;
      padding: 20px;
      text-align: center;
    }

    .diagram svg {
      display: block;
      max-width: none;
      height: auto;
      margin: 0 auto;
    }

    .diagram-error {
      text-align: left;
      white-space: pre-wrap;
    }

    .backdrop {
      display: none;
    }

    @media (max-width: 860px) {
      .topbar {
        grid-template-columns: auto minmax(0, 1fr) auto;
        gap: 10px;
        padding: 0 12px;
      }

      .brand {
        display: none;
      }

      .menu-button {
        display: inline-grid;
        place-items: center;
      }

      .actions .button:not(.menu-button) {
        display: none;
      }

      .sidebar {
        transform: translateX(-100%);
        transition: transform 180ms ease;
      }

      body.menu-open .sidebar {
        transform: translateX(0);
      }

      body.menu-open .backdrop {
        position: fixed;
        inset: var(--header-height) 0 0 0;
        z-index: 10;
        display: block;
        border: 0;
        background: rgba(24, 32, 29, 0.38);
      }

      main {
        margin-left: 0;
        padding: calc(var(--header-height) + 18px) 12px 36px;
      }

      .document {
        padding: 28px 20px 48px;
      }

      h1 {
        font-size: 27px;
      }

      h2 {
        font-size: 22px;
      }
    }

    @media print {
      body {
        background: #ffffff;
        font-size: 11pt;
      }

      .topbar,
      .sidebar,
      .backdrop {
        display: none !important;
      }

      main {
        margin: 0;
        padding: 0;
      }

      .document {
        width: 100%;
        border: 0;
        box-shadow: none;
        padding: 0;
      }

      h2,
      h3,
      h4,
      table,
      .diagram {
        break-inside: avoid;
      }

      a {
        color: inherit;
        text-decoration: none;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#top">VClassio <span>Check-in</span></a>
    <div class="search">
      <input id="search" type="search" placeholder="Tìm trong tài liệu" aria-label="Tìm trong tài liệu">
      <kbd>Enter</kbd>
    </div>
    <div class="actions">
      <button class="button menu-button" id="menuButton" type="button" aria-label="Mở mục lục" aria-expanded="false">☰</button>
      <button class="button" id="printButton" type="button">In tài liệu</button>
    </div>
  </header>

  <aside class="sidebar" aria-label="Mục lục">
    <p class="toc-label">Mục lục</p>
    <nav id="toc"></nav>
  </aside>
  <button class="backdrop" id="backdrop" type="button" aria-label="Đóng mục lục"></button>

  <main id="top">
    <article class="document" id="document">
      <p class="loading">Đang dựng tài liệu...</p>
    </article>
  </main>

    const documentRoot = document.getElementById("document");
    const toc = document.getElementById("toc");
    const search = document.getElementById("search");
    const menuButton = document.getElementById("menuButton");
    const backdrop = document.getElementById("backdrop");

    function decodeBase64Utf8(value) {
      const bytes = Uint8Array.from(atob(value), character => character.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function slugify(value, index) {
      const slug = value
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
      return slug || "muc-" + index;
    }

    function buildTableOfContents() {
      const headings = [...documentRoot.querySelectorAll("h2, h3, h4")];
      const usedIds = new Set();

      headings.forEach((heading, index) => {
        let id = slugify(heading.textContent, index);
        let suffix = 2;
        while (usedIds.has(id)) {
          id = slugify(heading.textContent, index) + "-" + suffix++;
        }
        usedIds.add(id);
        heading.id = id;

        const link = document.createElement("a");
        link.href = "#" + id;
        link.dataset.level = heading.tagName.slice(1);
        link.textContent = heading.textContent;
        link.addEventListener("click", closeMenu);
        toc.appendChild(link);
      });

      const observer = new IntersectionObserver(entries => {
        const visible = entries
          .filter(entry => entry.isIntersecting)
          .sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top)[0];
        if (!visible) return;
        toc.querySelectorAll("a").forEach(link => {
          link.classList.toggle("active", link.hash === "#" + visible.target.id);
        });
      }, { rootMargin: "-70px 0px -70% 0px" });

      headings.forEach(heading => observer.observe(heading));
    }

    function wrapTables() {
      documentRoot.querySelectorAll("table").forEach(table => {
        const wrapper = document.createElement("div");
        wrapper.className = "table-wrap";
        table.parentNode.insertBefore(wrapper, table);
        wrapper.appendChild(table);
      });
    }

    async function renderDiagrams() {
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "strict",
        theme: "base",
        themeVariables: {
          primaryColor: "#e8f5f0",
          primaryTextColor: "#18201d",
          primaryBorderColor: "#08775c",
          lineColor: "#5d6964",
          secondaryColor: "#f7f9f8",
          tertiaryColor: "#ffffff",
          fontFamily: "Arial, Helvetica, sans-serif"
        },
        flowchart: { htmlLabels: true, curve: "basis" },
        sequence: { useMaxWidth: false }
      });

      const blocks = [...documentRoot.querySelectorAll("pre code.language-mermaid")];
      for (const [index, code] of blocks.entries()) {
        const container = document.createElement("div");
        container.className = "diagram";
        try {
          const result = await mermaid.render("diagram-" + index, code.textContent);
          container.innerHTML = result.svg;
          result.bindFunctions?.(container);
        } catch (error) {
          container.classList.add("diagram-error");
          container.textContent = code.textContent;
        }
        code.parentElement.replaceWith(container);
      }
    }

    function closeMenu() {
      document.body.classList.remove("menu-open");
      menuButton.setAttribute("aria-expanded", "false");
    }

    function runSearch() {
      const query = search.value.trim();
      if (!query) return;
      window.find(query, false, false, true, false, false, false);
    }

    async function initialize() {
      try {
        if (!window.marked) throw new Error("Không tải được trình đọc Markdown.");
        const markdown = decodeBase64Utf8(markdownBase64);
        documentRoot.innerHTML = window.marked.parse(markdown, {
          gfm: true,
          breaks: false
        });
        wrapTables();
        buildTableOfContents();
        await renderDiagrams();
      } catch (error) {
        documentRoot.innerHTML = '<p class="error">Không thể dựng tài liệu: ' + error.message + "</p>";
      }
    }

    menuButton.addEventListener("click", () => {
      const open = document.body.classList.toggle("menu-open");
      menuButton.setAttribute("aria-expanded", String(open));
    });
    backdrop.addEventListener("click", closeMenu);
    document.getElementById("printButton").addEventListener("click", () => window.print());
    search.addEventListener("keydown", event => {
      if (event.key === "Enter") runSearch();
    });
    document.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
        event.preventDefault();
        search.focus();
      }
      if (event.key === "Escape") closeMenu();
    });

    initialize();
  </script>
