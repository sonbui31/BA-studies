name: BA Agent CI

on:
  push:
    branches:
      - main
    paths:
      - "BA-agent/**"
      - "README.md"
      - ".github/workflows/ba-agent-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "BA-agent/**"
      - "README.md"
      - ".github/workflows/ba-agent-ci.yml"
  workflow_dispatch:

jobs:
  audit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run bundle audit
        run: python BA-agent/scripts/ba_bundle_audit.py

      - name: Run runtime unit tests
        run: python -m unittest discover -s BA-agent/tests -v

      - name: Run golden BA evaluation
        run: python BA-agent/scripts/eval_golden_cases.py --format markdown

      - name: Curated templates and media
        run: |
          python BA-agent/scripts/template_schema_check.py "BA-agent/Curated templates"
          python BA-agent/scripts/media_audit.py "BA-agent/Curated templates"

      - name: Traceability (canonical strict) on fixtures and sample bundles
        run: |
          for bundle in BA-agent/tests/fixtures/canonical_bundle BA-agent/tests/fixtures/canonical_full_bundle \
                        BA-agent/BA-Documents-Outsource BA-agent/BA-Documents-Product; do
            echo "::group::$bundle"
            python BA-agent/scripts/traceability_scan.py "$bundle" --scheme canonical --strict
            echo "::endgroup::"
          done

      - name: Traceability (project scheme) on real-world pattern fixture
        run: python BA-agent/scripts/traceability_scan.py BA-agent/tests/fixtures/real_world_patterns --scheme project --strict

      - name: Pre-flight on sample bundles
        run: |
          python BA-agent/scripts/preflight_check.py BA-agent/BA-Documents-Outsource
          python BA-agent/scripts/preflight_check.py BA-agent/BA-Documents-Product

      # knowledge-index/chunks.jsonl is local-only (gitignored), so the packaged index cannot be
      # searched on CI. The missing-index exit code is covered by a unit test instead.

      - name: Smoke test Product Vision routing
        run: |
          output="$(python BA-agent/scripts/knowledge_search.py "B2B SaaS MVP product vision documents")"
          echo "$output"
          grep -q "KB-PRODUCT-VISION-001" <<< "$output"
